<p><strong>Smart search</strong> is now available to everyone. Combine free text with filters to find exactly what you need.</p>
<p><img src="{{media:smart-search.png}}" alt="Search results filtered by assignee and due date"></p>
<h2>Filters</h2>
<ul>
<li><code>assignee:me</code> or <code>assignee:@name</code></li>
<li><code>due:today</code>, <code>due:this-week</code>, <code>due:overdue</code></li>
<li><code>tag:design</code> and any of your own tags</li>
</ul>
<p>Results now update live as you type.</p>
