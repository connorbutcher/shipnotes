<div class="field">
  <label [for]="inputId()">Categories <em>(any)</em></label>
  <p-multiselect
    [inputId]="inputId()"
    [options]="options"
    optionLabel="label"
    optionValue="value"
    [maxSelectedLabels]="2"
    selectedItemsLabel="{0} categories"
    placeholder="All categories"
    [showClear]="true"
    [ngModel]="value()"
    (ngModelChange)="value.set($event ?? [])"
    styleClass="w-full"
  />
</div>
