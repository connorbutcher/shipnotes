<div class="toolbar">
  <a pButton routerLink=".." [text]="true" severity="secondary">
    <i class="pi pi-arrow-left" pButtonIcon></i>
    <span pButtonLabel>All release notes</span>
  </a>
  @if (!isNew()) {
    <button
      pButton
      type="button"
      severity="danger"
      [outlined]="true"
      size="small"
      [disabled]="saving()"
      (click)="delete()"
    >
      <i class="pi pi-trash" pButtonIcon></i>
      <span pButtonLabel>Delete</span>
    </button>
  }
</div>

<h2>{{ isNew() ? 'New release notes' : 'Edit release notes' }}</h2>

@if (note.isLoading()) {
  <app-loading-state label="Loading release notes…" />
} @else if (note.error()) {
  <p-message severity="error" icon="pi pi-times-circle">
    These release notes could not be loaded.
  </p-message>
} @else {
  <p-card>
    <app-release-note-form
      [releaseNote]="note.value() ?? null"
      [saving]="saving()"
      (saved)="save($event)"
    />
  </p-card>
}
