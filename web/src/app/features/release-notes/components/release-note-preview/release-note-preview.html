<header>
  <div>
    <h3 class="eyebrow">Preview</h3>
    <p class="text-muted text-sm">How consuming apps will render these notes.</p>
  </div>
  <p-tag
    [value]="published() ? 'Published on save' : 'Draft, not visible'"
    [severity]="published() ? 'success' : 'secondary'"
  />
</header>

@if (hasContent()) {
  <app-note-preview [note]="note()" />
} @else {
  <app-empty-state
    icon="pi-eye"
    heading="Nothing to preview yet"
    message="Start typing a version, title or notes and they will appear here."
  />
}
