@if (options().length) {
  <span class="label text-muted text-sm">Add a section</span>
  <div class="options" role="group" aria-label="Add a section">
    @for (option of options(); track option.value) {
      <button
        pButton
        type="button"
        size="small"
        severity="secondary"
        [outlined]="true"
        [attr.title]="option.description"
        (click)="picked.emit(option.value)"
      >
        <i [class]="option.icon" pButtonIcon></i>
        <span pButtonLabel>{{ option.label }}</span>
      </button>
    }
  </div>
}
