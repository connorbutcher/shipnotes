<p-table
  [value]="notes()"
  dataKey="id"
  [paginator]="notes().length > pageSize"
  [rows]="pageSize"
  [rowHover]="true"
  size="small"
>
  <ng-template #header>
    <tr>
      <th scope="col" class="version-column">Version</th>
      <th scope="col" pSortableColumn="title">Title <p-sorticon field="title" /></th>
      <th scope="col">Status</th>
      <th scope="col" pSortableColumn="updatedAt">Updated <p-sorticon field="updatedAt" /></th>
    </tr>
  </ng-template>
  <ng-template #body let-note>
    <tr class="row" (click)="open(note)">
      <td class="version">
        <a [routerLink]="[note.id]" (click)="$event.stopPropagation()">{{ note.version }}</a>
      </td>
      <td class="title">{{ note.title }}</td>
      <td>
        <span class="tags">
          @if (note.isPreRelease) {
            <p-tag severity="warn" value="Pre-release" />
          }
          @if (note.isPublished) {
            <p-tag
              severity="success"
              [value]="'Published ' + (note.publishedAt | date: 'mediumDate')"
            />
          } @else {
            <p-tag severity="secondary" value="Draft" />
          }
        </span>
      </td>
      <td class="muted">{{ note.updatedAt | date: 'medium' }}</td>
    </tr>
  </ng-template>
</p-table>
