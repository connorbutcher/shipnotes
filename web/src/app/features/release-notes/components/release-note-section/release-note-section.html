<header>
  <div class="heading">
    <app-category-tag [category]="option().value" />
    <span class="text-muted text-sm">{{ option().description }}</span>
  </div>
  <button
    pButton
    type="button"
    size="small"
    severity="secondary"
    [text]="true"
    [rounded]="true"
    [attr.aria-label]="'Remove the ' + option().label + ' section'"
    (click)="removed.emit()"
  >
    <i class="pi pi-times" pButtonIcon></i>
  </button>
</header>
<app-rich-text-editor
  [control]="section().controls.contentHtml"
  [uploadImage]="uploadImage()"
  [placeholder]="'What is in ' + option().label.toLowerCase() + '?'"
  [compact]="true"
/>
