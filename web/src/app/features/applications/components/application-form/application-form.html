<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="preview">
    <app-icon
      [name]="preview().name || '?'"
      [iconUrl]="form.controls.iconUrl.valid ? preview().iconUrl || null : null"
      [size]="56"
    />
  </div>

  <div class="field">
    <label for="application-name">Name</label>
    <input
      pInputText
      id="application-name"
      type="text"
      formControlName="name"
      [maxlength]="nameMaxLength"
      autocomplete="off"
      [invalid]="form.controls.name.touched && form.controls.name.invalid"
    />
    @if (form.controls.name.touched && form.controls.name.hasError('required')) {
      <p-message severity="error" variant="simple" size="small">Name is required.</p-message>
    }
  </div>

  <div class="field">
    <label for="application-icon-url">Icon URL <em>(optional)</em></label>
    <p-iconfield>
      <p-inputicon class="pi pi-image" />
      <input
        pInputText
        id="application-icon-url"
        type="url"
        formControlName="iconUrl"
        placeholder="https://example.com/icon.png"
        [fluid]="true"
        [invalid]="form.controls.iconUrl.touched && form.controls.iconUrl.invalid"
      />
    </p-iconfield>
    @if (form.controls.iconUrl.touched && form.controls.iconUrl.hasError('pattern')) {
      <p-message severity="error" variant="simple" size="small">
        Enter a full http or https URL.
      </p-message>
    }
  </div>

  <div class="actions">
    <button pButton type="submit" [loading]="saving()">
      <i class="pi pi-check" pButtonIcon></i>
      <span pButtonLabel>{{ saving() ? 'Saving…' : submitLabel() }}</span>
    </button>
  </div>
</form>
