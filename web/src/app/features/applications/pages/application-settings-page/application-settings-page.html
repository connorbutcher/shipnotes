<section class="card">
  <h2>Details</h2>
  <app-application-form [application]="application()" [saving]="busy()" (saved)="save($event)" />
</section>

<section class="card">
  <h2>API key</h2>
  <p class="muted">
    The current key starts with <code>{{ application()?.apiKeyPrefix }}</code
    >. Keys are stored hashed, so a lost key can't be recovered; issue a new one instead.
  </p>
  <button type="button" class="button secondary" [disabled]="busy()" (click)="regenerateKey()">
    Regenerate API key
  </button>
</section>

<section class="card danger">
  <h2>Delete application</h2>
  <p class="muted">Removes the application and all of its release notes.</p>
  <button type="button" class="button danger" [disabled]="busy()" (click)="delete()">
    Delete application
  </button>
</section>
