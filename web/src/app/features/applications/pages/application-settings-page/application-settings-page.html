<p-card header="Details">
  <app-application-form [application]="application()" [saving]="busy()" (saved)="save($event)" />
</p-card>

<p-card header="API key">
  <p class="text-muted">
    The current key starts with <code>{{ application()?.apiKeyPrefix }}</code
    >. Keys are stored hashed, so a lost key can't be recovered; issue a new one instead.
  </p>
  <button
    pButton
    type="button"
    severity="secondary"
    [outlined]="true"
    [disabled]="busy()"
    (click)="regenerateKey()"
  >
    <i class="pi pi-refresh" pButtonIcon></i>
    <span pButtonLabel>Regenerate API key</span>
  </button>
</p-card>

<p-card header="Delete application" styleClass="danger-zone">
  <p class="text-muted">Removes the application and all of its release notes.</p>
  <button pButton type="button" severity="danger" [disabled]="busy()" (click)="delete()">
    <i class="pi pi-trash" pButtonIcon></i>
    <span pButtonLabel>Delete application</span>
  </button>
</p-card>
